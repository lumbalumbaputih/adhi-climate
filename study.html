<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Study Room</title>
<link rel="icon" href="assets/logo-mark.svg">
<style>
  :root {
    --bg: #f6f8fb; --card: #ffffff; --ink: #1c2733; --ink-soft: #51606f; --ink-faint: #8595a5;
    --line: #e3e9f0; --accent: #2563eb; --accent-soft: #eaf0fe; --leaf: #0f9d63; --leaf-soft: #e7f6ef;
    --danger: #d5484d; --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f151d; --card: #171f29; --ink: #e8edf3; --ink-soft: #a8b4c1; --ink-faint: #6d7a88;
      --line: #26303c; --accent: #6d9bfa; --accent-soft: rgba(109,155,250,0.14); --leaf: #34d795; --leaf-soft: rgba(52,215,149,0.12); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.65; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }

  .lock { min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .lock__card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 34px 30px; box-shadow: 0 18px 50px rgba(10,20,40,0.12); text-align: center; }
  .lock__badge { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-soft); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; }
  .lock__title { font-size: 22px; letter-spacing: -0.02em; margin-bottom: 6px; }
  .lock__sub { font-size: 14px; color: var(--ink-soft); margin-bottom: 22px; }
  .lock__row { display: flex; gap: 8px; }
  .lock__input { flex: 1; font: 15px var(--mono); letter-spacing: 0.12em; padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); outline: none; min-width: 0; }
  .lock__input:focus { border-color: var(--accent); }
  .lock__btn { font-size: 14px; font-weight: 600; padding: 11px 18px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; cursor: pointer; }
  .lock__btn:disabled { opacity: 0.55; cursor: wait; }
  .lock__err { font-size: 13px; color: var(--danger); margin-top: 12px; min-height: 18px; }
  .lock__hint { font-size: 12px; color: var(--ink-faint); margin-top: 16px; }

  .room { display: none; max-width: 760px; margin: 0 auto; padding: 48px 22px 80px; }
  .s-head { margin-bottom: 28px; }
  .s-eyebrow { font: 11px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--leaf); margin-bottom: 10px; }
  .s-head h1 { font-size: clamp(28px, 5vw, 38px); letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 12px; }
  .s-lead { font-size: 16px; color: var(--ink-soft); max-width: 60ch; }
  .s-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px 26px 24px; margin-top: 20px; }
  .s-card h2 { font-size: 20px; letter-spacing: -0.02em; margin-bottom: 12px; }
  .s-card h3 { font: 11.5px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-faint); margin: 18px 0 7px; }
  .s-card p, .s-card li, .s-card dd { font-size: 15px; color: var(--ink); }
  .s-card ul { padding-left: 20px; display: grid; gap: 6px; }
  .s-num { font: 11px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .s-say { background: var(--leaf-soft); border-left: 3px solid var(--leaf); border-radius: 10px; padding: 12px 16px; font-style: italic; }
  .s-note { font-size: 13.5px; color: var(--ink-faint); margin-top: 10px; }
  .s-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .s-chip { font-size: 13.5px; background: var(--accent-soft); border: 1px solid transparent; color: var(--ink);
    border-radius: 999px; padding: 6px 13px; }
  .s-chip b { color: var(--accent); font-family: var(--mono); font-weight: 600; margin-right: 5px; }
  .s-qa dt { font-weight: 650; margin-top: 14px; }
  .s-qa dd { margin: 5px 0 0; padding: 10px 14px; background: var(--bg); border-radius: 10px; color: var(--ink-soft); }
  .s-gloss { display: grid; gap: 2px; }
  .s-gloss dt { font-weight: 650; margin-top: 12px; font-size: 14.5px; }
  .s-gloss dd { color: var(--ink-soft); font-size: 14px; }
  .s-card--pitch { border-color: var(--leaf); }
  .s-card--tips { border-color: var(--accent); }
  .room__foot { margin-top: 26px; font-size: 12.5px; color: var(--ink-faint); text-align: center; }
</style>
</head>
<body>
<div class="lock" id="lock">
  <form class="lock__card" id="form">
    <div class="lock__badge">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1 class="lock__title">Study Room</h1>
    <p class="lock__sub">This page is private. Enter the password to open your study notes.</p>
    <div class="lock__row">
      <input class="lock__input" id="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Password" aria-label="Password" autofocus>
      <button class="lock__btn" id="go" type="submit">Open</button>
    </div>
    <p class="lock__err" id="err" role="alert"></p>
    <p class="lock__hint">The notes are encrypted inside this page. Nothing is sent anywhere; the password unlocks them right here in your browser.</p>
  </form>
</div>
<main class="room" id="room"></main>
