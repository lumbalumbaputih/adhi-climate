<!DOCTYPE html>
<!-- Template for the per-project social-share cards. Rendered to
     assets/og/<id>.png by tools/build-og.js; not part of the served site. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Space Grotesk";
    src: url("fonts/SpaceGrotesk-600-latin.woff2") format("woff2");
    font-weight: 600;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("fonts/IBMPlexMono-500-latin.woff2") format("woff2");
    font-weight: 500;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #14224A;
    color: #fff;
    font-family: "Space Grotesk", "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
    padding: 64px 72px 0;
    position: relative;
  }
  .mono { font-family: "IBM Plex Mono", Menlo, monospace; font-weight: 500; }
  .top { display: flex; align-items: center; gap: 20px; }
  .top img { width: 56px; height: 56px; border-radius: 12px; }
  .top .name { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  .top .role { font-size: 15px; letter-spacing: 0.16em; color: #93B4FD; margin-top: 6px; text-transform: uppercase; }
  .eyebrow { margin-top: 58px; font-size: 22px; letter-spacing: 0.14em; color: #93B4FD; text-transform: uppercase; }
  .title { margin-top: 18px; font-size: 68px; font-weight: 600; line-height: 1.06; letter-spacing: -0.02em; max-width: 1010px; }
  .title.small { font-size: 56px; }
  .stat { position: absolute; left: 72px; bottom: 56px; display: flex; align-items: baseline; gap: 14px; }
  .stat .v { font-size: 58px; color: #6090FA; }
  .stat .u { font-size: 26px; color: #6090FA; }
  .stat .l { font-size: 24px; color: rgba(255,255,255,0.72); }
  .num { position: absolute; right: 48px; bottom: -60px; font-size: 300px; font-weight: 600; color: rgba(255,255,255,0.055); line-height: 1; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: linear-gradient(90deg, #2563EB, #6090FA, #34D795); }
</style>
</head>
<body>
  <div class="top">
    <img id="logo" src="../assets/logo-mark.svg" alt="">
    <div>
      <div class="name" id="name">Adhi Katili</div>
      <div class="role mono" id="role">Climate &amp; Sustainability · WA</div>
    </div>
  </div>
  <div class="eyebrow mono" id="eyebrow">Project 01 · 1985–2024</div>
  <div class="title" id="title">Project title</div>
  <div class="stat mono">
    <span class="v" id="v">40</span>
    <span class="u" id="u">yrs</span>
    <span class="l" id="l">of storm records</span>
  </div>
  <div class="num mono" id="num">01</div>
  <div class="bar"></div>
</body>
</html>
